name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Java build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test with Kafka and PostgreSQL
        run: mvn -B -ntp clean verify
      - name: Upload test reports and service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            pipeline-tests/target/service-logs/**
          if-no-files-found: ignore
          retention-days: 7

  dashboard:
    name: Dashboard type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Verify dashboard container serves its assets
        run: ./smoke-test.sh
