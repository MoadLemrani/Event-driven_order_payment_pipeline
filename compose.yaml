name: order-pipeline
x-service-healthcheck: &service-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
  interval: 10s
  timeout: 3s
  start_period: 60s
  retries: 6
services:
  kafka:
    image: docker.io/apache/kafka:3.9.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
  order-db:
    image: docker.io/library/postgres:17.9-alpine
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - order-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_db"]
      interval: 5s
      timeout: 3s
      retries: 12
  order-service:
    healthcheck: *service-healthcheck
    build:
      context: .
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: 8080
      OUTBOX_PUBLISHER_ENABLED: ${ORDER_OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USERNAME: order
      DB_PASSWORD: order_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  inventory-db:
    image: docker.io/library/postgres:17.9-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory_local
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory_db"]
      interval: 5s
      timeout: 3s
      retries: 12
  inventory-service:
    healthcheck: *service-healthcheck
    build:
      context: .
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: 8080
      OUTBOX_PUBLISHER_ENABLED: ${INVENTORY_OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      DB_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      DB_USERNAME: inventory
      DB_PASSWORD: inventory_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
  payment-db:
    image: docker.io/library/postgres:17.9-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment
      POSTGRES_PASSWORD: payment_local
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment -d payment_db"]
      interval: 5s
      timeout: 3s
      retries: 12
  payment-service:
    healthcheck: *service-healthcheck
    build:
      context: .
      args:
        SERVICE: payment-service
    environment:
      SERVER_PORT: 8080
      OUTBOX_PUBLISHER_ENABLED: ${PAYMENT_OUTBOX_PUBLISHER_ENABLED:-true}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-250}
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0}
      DB_URL: jdbc:postgresql://payment-db:5432/payment_db
      DB_USERNAME: payment
      DB_PASSWORD: payment_local
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
volumes:
  kafka-data:
  order-data:
  inventory-data:
  payment-data:
