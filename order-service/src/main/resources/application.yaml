spring:
  main:
    banner-mode: "off"
  task:
    scheduling:
      pool:
        size: 2
  application:
    name: order-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/order_db}
    username: ${DB_USERNAME:order}
    password: ${DB_PASSWORD:order_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        max.block.ms: 10000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    listener:
      ack-mode: record
server:
  port: ${SERVER_PORT:8081}
logging:
  structured:
    format:
      console: logstash
    json:
      customizer: dev.portfolio.order.observability.CorrelationLogCustomizer
      add:
        service: ${spring.application.name}
management:
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        spring.kafka.listener: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
outbox:
  publisher-enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
  poll-interval-ms: ${OUTBOX_POLL_INTERVAL_MS:250}
